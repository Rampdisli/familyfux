<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fuxis Plan — Neue Aufgabe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #FCEFE3;
    --cream-deep: #F7E3CF;
    --orange: #E8703C;
    --orange-deep: #C85A2C;
    --amber: #F6B93B;
    --brown: #5A3423;
    --brown-soft: #8A6250;
    --brown-muted: #B39C8C;
    --mint: #B8E6C4;
    --lilac: #DCC6F2;
    --sky: #BFE3F5;
    --rose: #F5C6CE;
    --peach: #F9D8B4;
    --shadow-warm: rgba(90, 52, 35, 0.16);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    font-family: 'Inter', sans-serif;
    background: linear-gradient(160deg, #FDF5EC 0%, var(--cream) 60%, var(--cream-deep) 100%);
    color: var(--brown);
  }

  .board {
    max-width: 1080px;
    margin: 0 auto;
    padding: 30px 34px 60px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    gap: 22px;
  }

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .back-link {
    font-size: 13.5px;
    font-weight: 600;
    color: var(--brown-soft);
    text-decoration: none;
  }

  .page-head h1 {
    font-family: 'Fredoka', sans-serif;
    font-weight: 600;
    font-size: 26px;
  }

  .page-head p {
    font-size: 13.5px;
    color: var(--brown-soft);
    margin-top: 4px;
  }

  .layout {
    display: grid;
    grid-template-columns: 1.5fr 1fr;
    gap: 22px;
    align-items: start;
  }

  .card {
    background: #fff;
    border-radius: 24px;
    padding: 22px;
    box-shadow: 0 16px 32px -18px var(--shadow-warm);
  }

  .field {
    margin-bottom: 20px;
  }

  .field:last-child { margin-bottom: 0; }

  .field label.f-label {
    display: block;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--brown-soft);
    text-transform: uppercase;
    letter-spacing: 0.3px;
    margin-bottom: 9px;
  }

  input[type="text"], input[type="number"], input[type="date"], select {
    width: 100%;
    border: 2px solid var(--cream-deep);
    background: var(--cream);
    border-radius: 13px;
    padding: 11px 14px;
    font-family: 'Inter', sans-serif;
    font-size: 14.5px;
    font-weight: 600;
    color: var(--brown);
    outline: none;
  }

  input:focus, select:focus { border-color: var(--orange); }

  /* Icon / color pickers */
  .swatch-row {
    display: flex;
    flex-wrap: wrap;
    gap: 9px;
  }

  .icon-swatch, .color-swatch {
    width: 38px; height: 38px;
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: 17px;
    cursor: pointer;
    border: 2.5px solid transparent;
    background: var(--cream);
  }

  .icon-swatch.active { border-color: var(--orange); }
  .color-swatch { border-radius: 50%; }
  .color-swatch.active { border-color: var(--brown); }
  .color-swatch.active::after { content: '✓'; font-size: 13px; color: var(--brown); font-weight: 700; }

  /* Reward stepper */
  .stepper {
    display: inline-flex;
    align-items: center;
    gap: 14px;
    background: var(--cream);
    border-radius: 14px;
    padding: 6px 8px;
  }

  .stepper button {
    width: 32px; height: 32px;
    border-radius: 10px;
    border: none;
    background: #fff;
    font-size: 17px;
    font-weight: 700;
    color: var(--orange-deep);
    cursor: pointer;
    box-shadow: 0 4px 10px var(--shadow-warm);
  }

  .stepper .val {
    font-family: 'Fredoka', sans-serif;
    font-weight: 600;
    font-size: 17px;
    min-width: 46px;
    text-align: center;
  }

  /* Type toggle (Einmalig / Wiederkehrend) */
  .type-toggle {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }

  .type-btn {
    border: 2.5px solid var(--cream-deep);
    background: var(--cream);
    border-radius: 16px;
    padding: 14px;
    text-align: left;
    cursor: pointer;
    font-family: 'Inter', sans-serif;
  }

  .type-btn .tb-title {
    font-family: 'Fredoka', sans-serif;
    font-weight: 600;
    font-size: 15px;
    color: var(--brown);
  }

  .type-btn .tb-sub {
    font-size: 11.5px;
    color: var(--brown-soft);
    margin-top: 2px;
  }

  .type-btn.active {
    border-color: var(--orange);
    background: #fff;
    box-shadow: 0 10px 22px -14px var(--shadow-warm);
  }

  /* Recurrence sub-panel */
  .recur-panel {
    background: var(--cream);
    border-radius: 16px;
    padding: 16px;
    margin-top: 14px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .weekday-row {
    display: flex;
    gap: 6px;
  }

  .weekday-chip {
    flex: 1;
    text-align: center;
    padding: 9px 0;
    border-radius: 11px;
    background: #fff;
    font-weight: 700;
    font-size: 12.5px;
    color: var(--brown-soft);
    cursor: pointer;
    border: 2px solid transparent;
  }

  .weekday-chip.active {
    background: var(--orange);
    color: #fff;
  }

  .inline-fields {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    font-size: 13.5px;
    font-weight: 600;
  }

  .inline-fields select, .inline-fields input[type="number"] {
    width: auto;
    min-width: 70px;
    padding: 8px 10px;
  }

  .hint-note {
    font-size: 12px;
    color: var(--brown-soft);
    line-height: 1.5;
  }

  .recur-summary {
    display: flex;
    align-items: center;
    gap: 8px;
    background: #fff;
    padding: 10px 14px;
    border-radius: 12px;
    font-size: 13px;
    font-weight: 600;
    color: var(--orange-deep);
  }

  /* Actions */
  .form-actions {
    display: flex;
    gap: 10px;
    margin-top: 26px;
  }

  .btn {
    border: none;
    padding: 13px 22px;
    border-radius: 14px;
    font-family: 'Inter', sans-serif;
    font-weight: 700;
    font-size: 14.5px;
    cursor: pointer;
  }

  .btn-primary {
    background: var(--orange);
    color: #fff;
    box-shadow: 0 14px 26px -10px rgba(232,112,60,0.55);
    flex: 1;
  }

  .btn-secondary {
    background: var(--cream);
    color: var(--brown);
  }

  /* PREVIEW */
  .preview-sticky { position: sticky; top: 22px; }

  .preview-label {
    font-size: 12.5px;
    font-weight: 700;
    color: var(--brown-soft);
    text-transform: uppercase;
    letter-spacing: 0.3px;
    margin-bottom: 12px;
  }

  .preview-tile {
    border: 2.5px dashed rgba(90,52,35,0.25);
    border-radius: 22px;
    padding: 18px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    min-height: 150px;
  }

  .preview-tile .pt-icon {
    width: 46px; height: 46px;
    border-radius: 14px;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px;
  }

  .preview-tile .pt-name {
    font-family: 'Fredoka', sans-serif;
    font-weight: 600;
    font-size: 15.5px;
    line-height: 1.25;
  }

  .preview-tile .pt-reward {
    font-size: 12.5px;
    color: var(--brown-soft);
  }

  .preview-tile .pt-claim {
    margin-top: auto;
    background: var(--orange);
    color: #fff;
    text-align: center;
    padding: 9px 0;
    border-radius: 12px;
    font-weight: 600;
    font-size: 13px;
  }

  .preview-recur {
    margin-top: 16px;
    background: var(--cream);
    border-radius: 16px;
    padding: 14px 16px;
    font-size: 13px;
    line-height: 1.5;
    color: var(--brown-soft);
  }

  .preview-recur b {
    color: var(--brown);
    font-family: 'Fredoka', sans-serif;
    display: block;
    font-size: 13.5px;
    margin-bottom: 3px;
  }

  @media (max-width: 820px) {
    .layout { grid-template-columns: 1fr; }
    .preview-sticky { position: static; }
  }
</style>
</head>
<body>

<div class="board">

  <div class="topbar">
    <a class="back-link" href="#">← Zurück zum Aufgaben-Pool</a>
  </div>

  <div class="page-head">
    <h1>Neue Aufgabe erstellen</h1>
    <p>Lege fest, wie die Aufgabe aussieht und ob sie sich wiederholt</p>
  </div>

  <div class="layout">

    <div class="card">

      <div class="field">
        <label class="f-label">Name der Aufgabe</label>
        <input type="text" id="taskName" placeholder="z. B. Zimmer aufräumen">
      </div>

      <div class="field">
        <label class="f-label">Symbol</label>
        <div class="swatch-row" id="iconRow"></div>
      </div>

      <div class="field">
        <label class="f-label">Farbe</label>
        <div class="swatch-row" id="colorRow"></div>
      </div>

      <div class="field">
        <label class="f-label">Sterne-Belohnung</label>
        <div class="stepper">
          <button id="rewardMinus">−</button>
          <div class="val" id="rewardVal">3 ⭐</div>
          <button id="rewardPlus">+</button>
        </div>
      </div>

      <div class="field">
        <label class="f-label">Aufgabentyp</label>
        <div class="type-toggle">
          <button class="type-btn active" data-type="einmalig">
            <div class="tb-title">Einmalig</div>
            <div class="tb-sub">taucht ein einziges Mal im Pool auf</div>
          </button>
          <button class="type-btn" data-type="wiederkehrend">
            <div class="tb-title">Wiederkehrend</div>
            <div class="tb-sub">erscheint automatisch immer wieder</div>
          </button>
        </div>
      </div>

      <div class="field" id="einmaligField">
        <label class="f-label">Datum</label>
        <input type="date" id="onceDate">
      </div>

      <div class="field" id="wiederkehrendField" style="display:none;">
        <label class="f-label">Wiederholung</label>
        <select id="recurType">
          <option value="taeglich">Täglich</option>
          <option value="woechentlich">Wöchentlich (an einem Tag)</option>
          <option value="wochentage">An bestimmten Wochentagen</option>
          <option value="alleXTage">Alle X Tage</option>
          <option value="monatlich">Monatlich (an einem Tag im Monat)</option>
          <option value="alleXWochen">Alle X Wochen</option>
          <option value="alleXMonate">Alle X Monate</option>
          <option value="jaehrlich">Jährlich</option>
          <option value="nachErledigung">X Tage nach letzter Erledigung</option>
        </select>

        <div class="recur-panel" id="recurPanel"></div>

        <div class="field" style="margin-top:14px;">
          <label class="f-label">Startdatum</label>
          <input type="date" id="startDate">
        </div>

        <div class="recur-summary" id="recurSummary">🔁 Wird jeden Tag im Pool angezeigt</div>
      </div>

      <div class="form-actions">
        <button class="btn btn-primary" id="saveBtn">Aufgabe erstellen</button>
        <button class="btn btn-secondary">Abbrechen</button>
      </div>

    </div>

    <div class="preview-sticky">
      <div class="preview-label">Vorschau im Pool</div>
      <div class="preview-tile" id="previewTile">
        <div class="pt-icon" id="pvIcon">🧸</div>
        <div class="pt-name" id="pvName">Zimmer aufräumen</div>
        <div class="pt-reward" id="pvReward">+3 ⭐</div>
        <div class="pt-claim">Ich mach's!</div>
      </div>
      <div class="preview-recur" id="previewRecur" style="display:none;">
        <b>Wiederholung</b>
        <span id="previewRecurText"></span>
      </div>
    </div>

  </div>

</div>

<script>
  const icons = ['🧸','🦷','🎒','🐕','🍽️','🧺','🌱','🗑️','📚','🧹','🚲','🛏️'];
  const colors = [
    { cls: 'mint', bg: 'var(--mint)' },
    { cls: 'lilac', bg: 'var(--lilac)' },
    { cls: 'sky', bg: 'var(--sky)' },
    { cls: 'rose', bg: 'var(--rose)' },
    { cls: 'peach', bg: 'var(--peach)' },
    { cls: 'amber', bg: 'var(--amber)' },
  ];
  const weekdays = ['Mo','Di','Mi','Do','Fr','Sa','So'];
  const weekdaysFull = ['Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag','Sonntag'];

  const state = {
    icon: icons[0],
    color: colors[0].cls,
    reward: 3,
    taskType: 'einmalig',
    recurType: 'taeglich',
    selectedWeekdays: [1], // Di active by default just as example
    everyXDays: 2,
    everyXWeeks: 2,
    everyXMonths: 2,
    monthDay: 1,
    yearMonth: 1,
    yearDay: 1,
    singleWeekday: 0,
    daysAfterDone: 3,
  };

  function colorBg(cls) {
    return (colors.find(c => c.cls === cls) || colors[0]).bg;
  }

  /* ---- Icon & color pickers ---- */
  const iconRow = document.getElementById('iconRow');
  const colorRow = document.getElementById('colorRow');

  function renderIconRow() {
    iconRow.innerHTML = icons.map(ic =>
      `<div class="icon-swatch ${ic === state.icon ? 'active' : ''}" data-icon="${ic}" style="background:${colorBg(state.color)}">${ic}</div>`
    ).join('');
    iconRow.querySelectorAll('.icon-swatch').forEach(el => {
      el.addEventListener('click', () => { state.icon = el.dataset.icon; renderIconRow(); updatePreview(); });
    });
  }

  function renderColorRow() {
    colorRow.innerHTML = colors.map(c =>
      `<div class="color-swatch ${c.cls === state.color ? 'active' : ''}" data-color="${c.cls}" style="background:${c.bg}"></div>`
    ).join('');
    colorRow.querySelectorAll('.color-swatch').forEach(el => {
      el.addEventListener('click', () => { state.color = el.dataset.color; renderColorRow(); renderIconRow(); updatePreview(); });
    });
  }

  /* ---- Reward stepper ---- */
  const rewardVal = document.getElementById('rewardVal');
  document.getElementById('rewardMinus').addEventListener('click', () => {
    state.reward = Math.max(1, state.reward - 1);
    rewardVal.textContent = state.reward + ' ⭐';
    updatePreview();
  });
  document.getElementById('rewardPlus').addEventListener('click', () => {
    state.reward = Math.min(10, state.reward + 1);
    rewardVal.textContent = state.reward + ' ⭐';
    updatePreview();
  });

  /* ---- Task name ---- */
  document.getElementById('taskName').addEventListener('input', updatePreview);

  /* ---- Type toggle ---- */
  const einmaligField = document.getElementById('einmaligField');
  const wiederkehrendField = document.getElementById('wiederkehrendField');
  document.querySelectorAll('.type-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.type-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      state.taskType = btn.dataset.type;
      einmaligField.style.display = state.taskType === 'einmalig' ? 'block' : 'none';
      wiederkehrendField.style.display = state.taskType === 'wiederkehrend' ? 'block' : 'none';
      updatePreview();
    });
  });

  /* ---- Recurrence panel ---- */
  const recurTypeSelect = document.getElementById('recurType');
  const recurPanel = document.getElementById('recurPanel');

  function weekdayRow(selectedArr, multi) {
    return `<div class="weekday-row" data-multi="${multi}">
      ${weekdays.map((wd, i) => `<div class="weekday-chip ${selectedArr.includes(i) ? 'active' : ''}" data-i="${i}">${wd}</div>`).join('')}
    </div>`;
  }

  function renderRecurPanel() {
    let html = '';
    switch (state.recurType) {
      case 'taeglich':
        html = `<div class="inline-fields">Wird jeden Tag im Pool angezeigt.</div>`;
        break;
      case 'woechentlich':
        html = `<div class="inline-fields">Jede Woche am:</div>` + weekdayRow([state.singleWeekday], false);
        break;
      case 'wochentage':
        html = `<div class="inline-fields">An diesen Wochentagen:</div>` + weekdayRow(state.selectedWeekdays, true);
        break;
      case 'alleXTage':
        html = `<div class="inline-fields">Alle
          <input type="number" min="1" max="60" id="xDays" value="${state.everyXDays}"> Tage</div>`;
        break;
      case 'monatlich':
        html = `<div class="inline-fields">Am
          <select id="monthDay">${Array.from({length:31},(_,i)=>i+1).map(d => `<option value="${d}" ${d===state.monthDay?'selected':''}>${d}.</option>`).join('')}</select>
          Tag jedes Monats</div>`;
        break;
      case 'alleXWochen':
        html = `<div class="inline-fields">Alle
          <input type="number" min="1" max="52" id="xWeeks" value="${state.everyXWeeks}"> Wochen, am:</div>` + weekdayRow([state.singleWeekday], false);
        break;
      case 'alleXMonate':
        html = `<div class="inline-fields">Alle
          <input type="number" min="1" max="24" id="xMonths" value="${state.everyXMonths}"> Monate, am
          <select id="monthDay2">${Array.from({length:31},(_,i)=>i+1).map(d => `<option value="${d}" ${d===state.monthDay?'selected':''}>${d}.</option>`).join('')}</select>
          Tag</div>`;
        break;
      case 'jaehrlich':
        html = `<div class="inline-fields">Jedes Jahr am
          <select id="yearDay">${Array.from({length:31},(_,i)=>i+1).map(d => `<option value="${d}" ${d===state.yearDay?'selected':''}>${d}.</option>`).join('')}</select>
          <select id="yearMonth">${['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'].map((m,i) => `<option value="${i+1}" ${i+1===state.yearMonth?'selected':''}>${m}</option>`).join('')}</select>
        </div>`;
        break;
      case 'nachErledigung':
        html = `<div class="inline-fields">Erscheint
          <input type="number" min="1" max="365" id="xDaysAfter" value="${state.daysAfterDone}"> Tage, nachdem sie zuletzt als erledigt markiert wurde</div>
          <div class="hint-note">Praktisch für Aufgaben ohne festen Rhythmus, z. B. „Blumen gießen“ oder „Auto waschen“ — der Countdown startet erst beim Abhaken, nicht an einem festen Datum.</div>`;
        break;
    }
    recurPanel.innerHTML = html;
    attachRecurHandlers();
  }

  function attachRecurHandlers() {
    recurPanel.querySelectorAll('.weekday-row').forEach(row => {
      const multi = row.dataset.multi === 'true';
      row.querySelectorAll('.weekday-chip').forEach(chip => {
        chip.addEventListener('click', () => {
          const i = parseInt(chip.dataset.i, 10);
          if (multi) {
            const idx = state.selectedWeekdays.indexOf(i);
            if (idx > -1) state.selectedWeekdays.splice(idx, 1);
            else state.selectedWeekdays.push(i);
            if (state.selectedWeekdays.length === 0) state.selectedWeekdays.push(i);
          } else {
            state.singleWeekday = i;
          }
          renderRecurPanel();
          updateSummary();
        });
      });
    });

    const xDays = document.getElementById('xDays');
    if (xDays) xDays.addEventListener('input', () => { state.everyXDays = parseInt(xDays.value || 1, 10); updateSummary(); });

    const xWeeks = document.getElementById('xWeeks');
    if (xWeeks) xWeeks.addEventListener('input', () => { state.everyXWeeks = parseInt(xWeeks.value || 1, 10); updateSummary(); });

    const xMonths = document.getElementById('xMonths');
    if (xMonths) xMonths.addEventListener('input', () => { state.everyXMonths = parseInt(xMonths.value || 1, 10); updateSummary(); });

    const monthDay = document.getElementById('monthDay');
    if (monthDay) monthDay.addEventListener('change', () => { state.monthDay = parseInt(monthDay.value, 10); updateSummary(); });

    const monthDay2 = document.getElementById('monthDay2');
    if (monthDay2) monthDay2.addEventListener('change', () => { state.monthDay = parseInt(monthDay2.value, 10); updateSummary(); });

    const yearDay = document.getElementById('yearDay');
    if (yearDay) yearDay.addEventListener('change', () => { state.yearDay = parseInt(yearDay.value, 10); updateSummary(); });

    const yearMonth = document.getElementById('yearMonth');
    if (yearMonth) yearMonth.addEventListener('change', () => { state.yearMonth = parseInt(yearMonth.value, 10); updateSummary(); });

    const xDaysAfter = document.getElementById('xDaysAfter');
    if (xDaysAfter) xDaysAfter.addEventListener('input', () => { state.daysAfterDone = parseInt(xDaysAfter.value || 1, 10); updateSummary(); });

    updateSummary();
  }

  recurTypeSelect.addEventListener('change', () => {
    state.recurType = recurTypeSelect.value;
    renderRecurPanel();
  });

  function recurSummaryText() {
    switch (state.recurType) {
      case 'taeglich':
        return 'Wird jeden Tag im Pool angezeigt';
      case 'woechentlich':
        return `Wird jede Woche am ${weekdaysFull[state.singleWeekday]} angezeigt`;
      case 'wochentage': {
        const days = state.selectedWeekdays.slice().sort((a,b)=>a-b).map(i => weekdaysFull[i]);
        return `Wird angezeigt an: ${days.join(', ')}`;
      }
      case 'alleXTage':
        return `Wird alle ${state.everyXDays} Tage angezeigt`;
      case 'monatlich':
        return `Wird jeden Monat am ${state.monthDay}. angezeigt`;
      case 'alleXWochen':
        return `Wird alle ${state.everyXWeeks} Wochen am ${weekdaysFull[state.singleWeekday]} angezeigt`;
      case 'alleXMonate':
        return `Wird alle ${state.everyXMonths} Monate am ${state.monthDay}. angezeigt`;
      case 'jaehrlich': {
        const months = ['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
        return `Wird jedes Jahr am ${state.yearDay}. ${months[state.yearMonth-1]} angezeigt`;
      }
      case 'nachErledigung':
        return `Erscheint ${state.daysAfterDone} Tage nach der letzten Erledigung wieder`;
    }
    return '';
  }

  function updateSummary() {
    const text = recurSummaryText();
    document.getElementById('recurSummary').innerHTML = `🔁 ${text}`;
    updatePreview();
  }

  /* ---- Preview ---- */
  function updatePreview() {
    const name = document.getElementById('taskName').value.trim() || 'Neue Aufgabe';
    document.getElementById('pvName').textContent = name;
    document.getElementById('pvIcon').textContent = state.icon;
    document.getElementById('pvIcon').style.background = colorBg(state.color);
    document.getElementById('pvReward').textContent = `+${state.reward} ⭐`;

    const previewRecur = document.getElementById('previewRecur');
    if (state.taskType === 'wiederkehrend') {
      previewRecur.style.display = 'block';
      document.getElementById('previewRecurText').textContent = recurSummaryText();
    } else {
      previewRecur.style.display = 'none';
    }
  }

  /* ---- Init ---- */
  renderIconRow();
  renderColorRow();
  renderRecurPanel();
  updatePreview();

  document.getElementById('saveBtn').addEventListener('click', () => {
    alert('Prototyp: Hier würde die Aufgabe gespeichert und erscheint danach im Aufgaben-Pool.');
  });
</script>

</body>
</html>
