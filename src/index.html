<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>FamilyFux</title>
  <!-- In the Docker image rewritten at container start from BASE_HREF. -->
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Browser tab. New file names on purpose: nginx lets browsers cache .ico / .png for a year, so the
       old Angular favicon.ico would otherwise stay. favicon.ico is replaced too (some browsers ask for it). -->
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="favicon-192.png">
  <!-- Home screen icon on iPhone / iPad ("Zum Home-Bildschirm"); iOS rounds the corners itself. -->
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="apple-mobile-web-app-title" content="FamilyFux">
  <!-- Runtime config; in the Docker image written at container start from env vars. -->
  <script src="config.js"></script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
