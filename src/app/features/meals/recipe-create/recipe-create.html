<div class="board">
  <a routerLink="/essen" class="back-link">← Zurück zu den Rezepten</a>

  <div class="page-head">
    <h1>Rezept importieren</h1>
    <p>Link von Fooby oder Cookidoo einfügen – oder ein eigenes Rezept erfassen</p>
  </div>

  <div class="layout">
    <app-recipe-form
      [(draft)]="draft"
      [saving]="saving()"
      [errorMessage]="errorMessage()"
      cancelLink="/essen"
      (save)="save()"
    />

    <aside class="preview-sticky">
      <app-recipe-preview [title]="draft().title" [url]="link()" [image]="image()" [ingredients]="ingredients()" />
    </aside>
  </div>
</div>
