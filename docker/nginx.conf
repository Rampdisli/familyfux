# Serves the compiled Angular app as a SPA. Port 8080 because the image runs
# as a non-root user, which may not bind to 80.
server {
    listen       8080;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # Container health check / reverse-proxy probe.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Written fresh on every container start — must never be cached, or the app
    # would keep talking to the previous Supabase project.
    location = /config.js {
        add_header Cache-Control "no-store";
    }

    # The entry point references hashed bundle names, so it must not be cached.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # Everything the Angular build emits has a content hash in its name.
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpe?g|gif|webp|avif|ico|map)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Client-side routing: unknown paths are Angular routes, not 404s.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css application/javascript application/json
                      image/svg+xml application/manifest+json;

    server_tokens off;
}
