name: Publish app image

# Builds the Angular app image and pushes it to GitHub Container Registry.
# No PAT needed — the job's GITHUB_TOKEN can write packages of this repo.
# The image version comes from package.json (like the MCP server's); a v* tag
# additionally produces its semver tags.

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'src/**'
      - 'public/**'
      - 'docker/**'
      - 'Dockerfile'
      - '.dockerignore'
      - 'angular.json'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - '.github/workflows/publish-app.yml'
  workflow_dispatch:

env:
  IMAGE: ghcr.io/rampdisli/familyfux-app

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - id: version
        run: echo "version=$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"

      # arm64 is emulated, so it can be dropped from `platforms` below if the
      # NAS is the only target and CI time matters.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # `latest` + short SHA + the package.json version (e.g. 0.2.0) on every
          # main push; v1.2.3 tags additionally produce 1.2.3 and 1.2.
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=raw,value=${{ steps.version.outputs.version }},enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
