services:
  app:
    build:
      context: .
      args:
        VERSION: "0.8.0"
    image: ghcr.io/rampdisli/familyfux-app:0.8.0
    ports:
      - "8080:8080"
    environment:
      # Browser-side values, injected into config.js on container start.
      # Same pair as src/environments/environment.ts; override in a .env file
      # next to this compose file to point the image at another project.
      SUPABASE_URL: ${SUPABASE_URL:-https://aenkarrgedrcnqxpakam.supabase.co}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-sb_publishable_2YZFv1NUDi27_WbPcVoewg_tsu1UDeE}
      # URL path the app is served under, e.g. /familyfux when it sits behind a
      # reverse proxy. Becomes <base href> in index.html.
      BASE_HREF: ${BASE_HREF:-/}
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped
